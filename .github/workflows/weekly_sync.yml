name: CineRecs Weekly Sync

on:
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install huggingface_hub

      - name: Run weekly sync
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          UPSTASH_REDIS_URL: ${{ secrets.UPSTASH_REDIS_URL }}
          UPSTASH_REDIS_TOKEN: ${{ secrets.UPSTASH_REDIS_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/weekly_sync.py

      - name: Reload index on Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          import os
          from huggingface_hub import HfApi
          token = os.environ.get('HF_TOKEN')
          if token:
              api = HfApi(token=token)
              try:
                  api.upload_file(
                      path_or_fileobj='backend/data/movie_id_map.json',
                      path_in_repo='data/movie_id_map.json',
                      repo_id='Pritu16345/cinerecs-api',
                      repo_type='space',
                      commit_message='weekly movie_id_map update'
                  )
                  print('✓ Updated movie_id_map.json in Hugging Face Space')
              except Exception as e:
                  print(f'Note on map upload: {e}')

              try:
                  api.restart_space(repo_id='Pritu16345/cinerecs-api')
                  print('✓ Successfully restarted Hugging Face Space to load updated index from R2')
              except Exception as e:
                  print(f'Note on restart space: {e}')
          else:
              print('HF_TOKEN not provided, skipping Space restart')
          "